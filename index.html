<!doctype html>
<!--
  The only HTML page of the game.
  The Phaser canvas goes inside #game. The login form is normal HTML on top
  of it, because only real HTML inputs open the phone keyboard and the
  Chinese input method properly.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the game use the whole screen on phones with a notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixel World</title>
  </head>
  <body>
    <!-- Phaser puts its canvas in here. -->
    <div id="game"></div>

    <!-- Player names and chat bubbles (HTML, so the text is sharp on every screen).
         Filled by src/ui/PlayerOverlay.js. Taps and clicks pass through it. -->
    <div id="player-overlay"></div>

    <!-- Chat history. Filled by src/ui/ChatLog.js. -->
    <div id="chat-log" hidden>
      <button id="chat-log-toggle" type="button" aria-controls="chat-log-lines">Chat ▾</button>
      <div id="chat-log-lines" aria-live="polite"></div>
    </div>

    <!-- The chat box. Opened with Enter (PC) or the chat button (phone). See src/ui/ChatInput.js.
         enterkeyhint="send" shows a "Send" key on phone keyboards.
         autocomplete/autocorrect off: chat is short and casual, and phones should not rewrite it. -->
    <form id="chat-bar" hidden>
      <input
        id="chat-input"
        type="text"
        enterkeyhint="send"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="Say something…"
        aria-label="Chat message"
      />
      <span id="chat-counter" hidden></span>
      <button id="chat-send" type="submit">Send</button>
    </form>

    <!-- Short messages like "You are sending messages too fast". -->
    <div id="chat-notice" role="status" hidden></div>

    <!-- Opens the chat box on phones (bottom-right, away from the joystick). -->
    <button id="chat-button" type="button" aria-label="Chat" hidden>Chat</button>

    <!-- Login / register screen. Shown when the player is not logged in. -->
    <div id="auth-screen" class="overlay">
      <form id="auth-form" class="card" novalidate>
        <h1>Pixel World</h1>

        <!-- Shown while we check a saved login on page load. -->
        <p id="auth-loading" class="loading">Loading…</p>

        <div id="auth-fields" hidden>
          <label for="auth-username">Username</label>
          <!-- autocapitalize/autocorrect off: phones should not change the name. -->
          <input
            id="auth-username"
            name="username"
            type="text"
            autocomplete="username"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            maxlength="16"
          />

          <label for="auth-password">Password</label>
          <input id="auth-password" name="password" type="password" autocomplete="current-password" />

          <!-- Only shown when creating an account, to catch typos. -->
          <div id="auth-confirm-row" hidden>
            <label for="auth-confirm">Confirm password</label>
            <input id="auth-confirm" name="confirm" type="password" autocomplete="new-password" />
          </div>

          <p id="auth-error" class="error" role="alert"></p>

          <button id="auth-submit" type="submit">Log in</button>
          <button id="auth-switch" type="button" class="link-button">No account? Create one</button>
        </div>
      </form>
    </div>

    <!-- Shown while the game is running. -->
    <button id="logout-button" type="button" hidden>Log out</button>

    <!-- Connection status of the real-time server, for example "Online (2 players)". -->
    <div id="net-status" hidden>
      <span id="net-status-text"></span>
      <button id="net-status-button" type="button" hidden></button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
